 <div class="race-row">
            <div class="race-info">
                <strong class="titulo">${corrida.name}</strong>

                <p class="country-location">
                    ${corrida.country}
                </p>

                <p class="city">
                    ${corrida.city}
                </p>

                <p class="circuit">
                    ${corrida.circuit}
                </p>

                <img src="${corrida.image}" alt="circuitImage">
            </div>

            <div class="caracteristicas">

                <p class="distance">
                    ${corrida.distance}
                </p>

                <p class="laps">
                    ${corrida.laps} voltas
                </p>

                <p class="date">
                    ${corrida.date}
                </p>

                <p class="status">
                    ${corrida.status}
                </p>

            </div>

        </div>
