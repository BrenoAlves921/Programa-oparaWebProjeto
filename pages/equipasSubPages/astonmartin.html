<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>F1 Pulse | Aston Martin</title>

  <link rel="stylesheet" href="../../assets/css/equipesub.css">
</head>

<body>

  <!-- HEADER -->
  <header class="topbar">
    <div class="logo">
      F1 <span>Pulse</span>
    </div>

    <nav class="navbar">
      <a href="../../index.html">Home</a>
      <a href="../agenda.html">Agenda</a>
      <a href="../equipas.html">Equipas</a>
      <a href="../pilotos.html">Pilotos</a>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">

    <img
      src="../../assets/Logos/astonmartin.png"
      class="team-logo"
      alt="Aston Martin Logo"
    />

    <div class="hero-info">
      <h1>Aston Martin F1 Team</h1>

      <p>
        Equipa britânica de Fórmula 1 conhecida pelo seu design verde icónico e forte evolução recente no grid.
      </p>
    </div>

  </section>

  <!-- PILOTOS -->
  <section class="drivers-section">
    <h2>Pilotos</h2>

    <div class="drivers-grid" id="drivers-grid">
      <p>Carregando pilotos...</p>
    </div>
  </section>

  <!-- INFO -->
  <section class="team-info">

    <div class="info-grid">

      <div class="info-card">
        <h3>Base</h3>
        <p>Silverstone, Reino Unido</p>
      </div>

      <div class="info-card">
        <h3>Motor</h3>
        <p>Mercedes</p>
      </div>

      <div class="info-card">
        <h3>Estreia</h3>
        <p>2021</p>
      </div>

      <div class="info-card">
        <h3>Títulos</h3>
        <p>0 Campeonatos</p>
      </div>

    </div>

  </section>

  <script>
  async function carregarPilotos() {
    const container = document.getElementById("drivers-grid");

    try {
      // 1. Fetch com encoding correto para a URL
      const response = await fetch("https://api.openf1.org/v1/drivers?team_name=" + encodeURIComponent("Aston Martin"));
      const drivers = await response.json();

      if (!drivers || drivers.length === 0) {
        container.innerHTML = "<p>Nenhum piloto registrado.</p>";
        return;
      }

      // 2. FILTRAGEM SEGURA
      // Usamos um Map para garantir que, para cada ID de piloto (driver_id), 
      // tenhamos apenas um registo.
      const mapaPilotos = new Map();
      drivers.forEach(d => {
        // Filtramos apenas pilotos que possuem um número atribuído (titulares)
        if (d.driver_number !== null) {
          mapaPilotos.set(d.driver_id, d);
        }
      });
      
      const uniqueDrivers = Array.from(mapaPilotos.values());

      container.innerHTML = "";

      uniqueDrivers.forEach(driver => {
        // 3. TRATAMENTO DE IMAGEM
        // Se a URL for inválida, o onerror força um placeholder local ou via.placeholder
        const imgUrl = (driver.headshot_url && driver.headshot_url.startsWith('http')) 
          ? driver.headshot_url 
          : "https://via.placeholder.com/150/CCCCCC/FFFFFF?text=Sem+Foto";

        const card = document.createElement("div");
        card.className = "driver-card";

        card.innerHTML = `
          <img src="${imgUrl}" alt="${driver.full_name}" 
               onerror="this.src='https://via.placeholder.com/150/CCCCCC/FFFFFF?text=Sem+Foto';">
          <h3>${driver.full_name}</h3>
          <p>Número #${driver.driver_number}</p>
          <p>${driver.country_code || ""}</p>
        `;
        container.appendChild(card);
      });

    } catch (err) {
      console.error("Erro:", err);
      container.innerHTML = "<p>Erro ao carregar pilotos.</p>";
    }
  }

  carregarPilotos();
</script>

</body>
</html>
