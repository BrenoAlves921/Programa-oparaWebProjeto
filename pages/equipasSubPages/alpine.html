<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>F1 Pulse | Alpine</title>

  <link rel="stylesheet" href="../../assets/css/equipesub.css">
</head>

<body>

  <!-- HEADER -->
  <header class="topbar">
    <div class="logo">
      F1 <span>Pulse</span>
    </div>

    <nav class="navbar">
  <a href="../../index.html">Home</a>
  <a href="../agenda.html">Agenda</a>
  <a href="../equipas.html">Equipas</a>
  <a href="../pilotos.html">Pilotos</a>
</nav>
  </header>

  <!-- HERO -->
  <section class="hero">

    <img
      src="../../assets/Logos/alpine.png"
      class="team-logo"
      alt="Alpine Logo"
    />

    <div class="hero-info">
      <h1>Alpine F1 Team</h1>

      <p>
        Equipa francesa de Fórmula 1 conhecida pela sua
        identidade azul marcante e pela herança Renault.
      </p>
    </div>

  </section>

  <!-- PILOTOS -->
  <section class="drivers-section">
    <h2>Pilotos</h2>

    <div class="drivers-grid" id="drivers-grid">
      <p>Carregando pilotos...</p>
    </div>
  </section>

  <!-- INFO -->
  <section class="team-info">

    <div class="info-grid">

      <div class="info-card">
        <h3>Base</h3>
        <p>Enstone, Reino Unido</p>
      </div>

      <div class="info-card">
        <h3>Motor</h3>
        <p>Renault</p>
      </div>

      <div class="info-card">
        <h3>Estreia</h3>
        <p>2021</p>
      </div>

      <div class="info-card">
        <h3>Títulos</h3>
        <p>2 Campeonatos</p>
      </div>

    </div>

  </section>

  <script>
  async function carregarPilotos() {
    const container = document.getElementById("drivers-grid");

    try {
      const response = await fetch(
        "https://api.openf1.org/v1/drivers?team_name=Alpine"
      );

      const drivers = await response.json();

      // remover duplicados
      const uniqueDrivers = [];

      drivers.forEach(driver => {
        const exists = uniqueDrivers.find(
          d => d.driver_number === driver.driver_number
        );

        if (!exists) {
          uniqueDrivers.push(driver);
        }
      });

      container.innerHTML = "";

      uniqueDrivers.forEach(driver => {

        // ✔ fallback de imagem
        const imgUrl = driver.headshot_url
          ? driver.headshot_url
          : "https://via.placeholder.com/120?text=F1";

        const card = document.createElement("div");
        card.className = "driver-card";

        card.innerHTML = `
          <img src="${imgUrl}" alt="${driver.full_name}" />
          <h3>${driver.full_name}</h3>
          <p>Número #${driver.driver_number}</p>
          <p>${driver.country_code}</p>
        `;

        container.appendChild(card);
      });

    } catch (err) {
      container.innerHTML = "<p>Erro ao carregar pilotos.</p>";
      console.error(err);
    }
  }

  carregarPilotos();
</script>

</body>
</html>
