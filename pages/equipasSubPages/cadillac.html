<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>F1 Pulse | Cadillac</title>

  <link rel="stylesheet" href="../../assets/css/equipesub.css">
</head>

<body>

  <!-- HEADER -->
  <header class="topbar">
    <div class="logo">
      F1 <span>Pulse</span>
    </div>

    <nav class="navbar">
      <a href="../../index.html">Home</a>
      <a href="../agenda.html">Agenda</a>
      <a href="../equipas.html">Equipas</a>
      <a href="../pilotos.html">Pilotos</a>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">

    <!-- Certifique-se de ter o arquivo cadillac.png na pasta assets/Logos/ -->
    <img
      src="../../assets/Logos/cadillac.png"
      class="team-logo"
      alt="Cadillac Logo"
    />

    <div class="hero-info">
      <h1>Cadillac F1 Team</h1>

      <p>
        A marca de luxo americana traz a sua herança de competição para o 
        topo do automobilismo, unindo tradição e alta performance tecnológica.
      </p>
    </div>

  </section>

  <!-- PILOTOS -->
  <section class="drivers-section">
    <h2>Pilotos</h2>

    <div class="drivers-grid" id="drivers-grid">
      <p>Carregando pilotos...</p>
    </div>
  </section>

  <!-- INFO -->
  <section class="team-info">

    <div class="info-grid">

      <div class="info-card">
        <h3>Base</h3>
        <p>Warren, EUA</p>
      </div>

      <div class="info-card">
        <h3>Motor</h3>
        <p>Cadillac</p>
      </div>

      <div class="info-card">
        <h3>Estreia</h3>
        <p>2026</p>
      </div>

      <div class="info-card">
        <h3>Títulos</h3>
        <p>N/A</p>
      </div>

    </div>

  </section>

  <script>
  async function carregarPilotos() {
    const container = document.getElementById("drivers-grid");

    try {
      // Ajuste: A query mudou para team_name=Cadillac
      const response = await fetch(
        "https://api.openf1.org/v1/drivers?team_name=Cadillac"
      );

      const drivers = await response.json();

      if (drivers.length === 0) {
        container.innerHTML = "<p>Nenhum piloto registrado para esta equipa ainda.</p>";
        return;
      }

      const uniqueDrivers = [];
      drivers.forEach(driver => {
        const exists = uniqueDrivers.find(d => d.driver_number === driver.driver_number);
        if (!exists) {
          uniqueDrivers.push(driver);
        }
      });

      container.innerHTML = "";

      uniqueDrivers.forEach(driver => {
        const imgUrl = driver.headshot_url ? driver.headshot_url : "https://via.placeholder.com/120?text=F1";

        const card = document.createElement("div");
        card.className = "driver-card";

        card.innerHTML = `
          <img src="${imgUrl}" alt="${driver.full_name}" />
          <h3>${driver.full_name}</h3>
          <p>Número #${driver.driver_number}</p>
          <p>${driver.country_code}</p>
        `;

        container.appendChild(card);
      });

    } catch (err) {
      container.innerHTML = "<p>Erro ao carregar pilotos.</p>";
      console.error(err);
    }
  }

  carregarPilotos();
</script>

</body>
</html>
